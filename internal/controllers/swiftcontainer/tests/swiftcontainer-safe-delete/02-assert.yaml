---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: SwiftContainer
metadata:
  name: swiftcontainer-safe-delete-nonempty
status:
  conditions:
    - type: Progressing
      status: "False"
      reason: UnrecoverableError
      message: "Cannot delete container: Swift container is not empty."
---
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
resourceRefs:
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: SwiftContainer
      name: swiftcontainer-safe-delete-nonempty
      ref: container
assertAll:
    - celExpr: "container.metadata.deletionTimestamp != 0"
