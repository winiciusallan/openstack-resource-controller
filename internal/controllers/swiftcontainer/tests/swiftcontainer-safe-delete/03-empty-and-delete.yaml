apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - script: |
      cd $(dirname ${E2E_KUTTL_OSCLOUDS})
      export OS_CLOUD=openstack
      openstack object delete swiftcontainer-safe-delete-nonempty test_file.txt
  - command: kubectl wait --for=delete swiftcontainer/swiftcontainer-safe-delete-nonempty --timeout=60s
