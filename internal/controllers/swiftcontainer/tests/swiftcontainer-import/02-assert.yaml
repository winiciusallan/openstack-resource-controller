---
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
resourceRefs:
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: SwiftContainer
      name: swiftcontainer-import-external
      ref: container1
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: SwiftContainer
      name: swiftcontainer-import-external-not-this-one
      ref: container2
assertAll:
    - celExpr: "container1.status.id != container2.status.id"
---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: SwiftContainer
metadata:
  name: swiftcontainer-import
status:
  conditions:
    - type: Available
      message: OpenStack resource is available
      status: "True"
      reason: Success
    - type: Progressing
      message: OpenStack resource is up to date
      status: "False"
      reason: Success
  id: swiftcontainer-import-external
  resource:
    name: swiftcontainer-import-external
    quotaBytes: 5368709120
    quotaCount: 25000
    bytesUsed: 0
    objectCount: 0
