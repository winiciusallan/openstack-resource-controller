# fullsend per-repo configuration
# https://github.com/fullsend-ai/fullsend
#
# This file configures fullsend for per-repo installation mode.
# See https://fullsend.sh/docs/guides/infrastructure/layered-config-reference
version: "1"
runtime: pi
roles:
    - triage
    - coder
    - review
    - fix
    - retro
    - prioritize
agents:
    - name: triage
      model: gateway/gpt-6-luna
    - name: code
      runtime: claude
      model: gateway/claude-opus-5-5
      effort: high
    - name: review
      model: gateway/gpt-6-luna
      effort: high
    - name: fix
      model: gateway/gpt-6.1-sol
      effort: high
    - name: retro
      model: gateway/gpt-6-luna
      subagents:
        default: gateway/gpt-6-luna
    - name: prioritize
      model: gateway/gpt-6-luna
allowed_remote_resources:
    - https://raw.githubusercontent.com/fullsend-ai/fullsend/
    - https://raw.githubusercontent.com/fullsend-ai/agents/
create_issues:
    allow_targets:
        repos:
            - fullsend-ai/fullsend
            - fullsend-ai/agents
inference:
    gateway:
        url: https://api.enmaas.devshift.net
        auth: api-key
        models:
            gpt-6-luna:
                api: openai-responses
            claude-opus-5-5:
                api: anthropic-messages
